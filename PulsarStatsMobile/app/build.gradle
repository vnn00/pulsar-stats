plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pulsarstats.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.pulsarstats.mobile"
        minSdk 24  // Android 7.0+ (Notification channels için)
        targetSdk 34
    versionCode 5
    versionName "3.10.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Signing configs removed for open source release
    // Users should create their own keystore for release builds

    buildTypes {
        release {
            // signingConfig should be configured by users with their own keystore
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.preference:preference:1.2.1' // Ayarlar için eklendi
    
    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'
    
    // SignalR Java Client
    implementation 'com.microsoft.signalr:signalr:7.0.0'
    // RxJava dependency for SignalR
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    
    // Gson (JSON parsing)
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
